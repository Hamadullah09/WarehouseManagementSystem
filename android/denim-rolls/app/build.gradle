plugins {
    id 'com.android.application'
}

android {
    namespace 'com.smatechnology.denimrolls'
    compileSdk 34

    defaultConfig {
        applicationId "com.smatechnology.denimrolls"
        // The U300 runs Android 11 (API 30); 24 keeps handheld terminals in scope.
        minSdk 24
        targetSdk 34
        versionCode 7
        versionName "2.2.0"

        // The Chainway SDK ships native libraries for ARM only.
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    signingConfigs {
        release {
            def props = new Properties()
            def file = rootProject.file('keystore.properties')

            if (file.exists()) {
                props.load(new FileInputStream(file))
                storeFile rootProject.file(props['storeFile'])
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            minifyEnabled false
        }

        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            // Falls back to unsigned when no keystore.properties is present, so
            // a clone builds without anyone's signing material.
            if (rootProject.file('keystore.properties').exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/*.kotlin_module', 'META-INF/DEPENDENCIES']
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // Chainway DeviceAPI. Runs against the reader's own UHF module.
    implementation files('libs/DeviceAPI_ver20231208_release.aar')

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.google.android.material:material:1.12.0'

    // Networking and JSON use the platform's own HttpURLConnection and
    // org.json rather than pulling in a stack: fewer moving parts to keep
    // patched on a device that may sit on a warehouse LAN for years.
}
